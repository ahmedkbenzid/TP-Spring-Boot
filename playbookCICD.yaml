---
- name: Build and Deploy Docker Image to kubernetes
hosts: localhost
connection: local

vars:
  image_name: my-compte-service
  image_tag: 9
  dockerfile_path: './'
  docker_registry_username: ahmedk189
  docker_registry_password:  yBVf)5)hfE#VRaj

tasks:
- name: Log in Docker Hub
  community.general.docker_login:
    username: "{{docker_registry_username}}"
    password: "{{docker_registry_passwoed}}"
    reauthorize: yes

- name: Build Docker image
  docker_image:
    build:
      path: "{{dockerfile_path}}"
    name: "{{docker_registry_username}}/{{image_name}}:{{image_tag}}"
    source: build
    state: present
    tag: "{{image_tag}}"

- name: Push the Docker image to Docker Hub
  docker_image:
    name: "{{ docker_registry_username }}/{{ image_name }}: {{ image_tag }}"
    tag: "{{ image_tag }}"
    push: yes
    source: local

- name: Pull Docker image (optional, for verification or on target nodes)
  docker_image:
    name: "{{ docker_registry_username }}/{{ image_name }}:{{ image_tag }}"
    tag: "{{ image_tag }}"
    source: pull

- name: Apply Kubernetes Deployment
  kubernetes.core.k8s:
    state: present
    namespace: jenkins
    src: my-deployment.yaml
    kubeconfig: config

- name: Apply Kubernetes Service
  kubernetes.core.k8s:
    state: present
    namespace: jenkins
    src: service.yaml
    kubeconfig: config
    
    
